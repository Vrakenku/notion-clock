<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Weather</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  .weather {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 4px;
    color: #1f1f1f;
    font-family: "DotGothic16", sans-serif;
    white-space: nowrap;
  }

  .icon {
    width: 28px;
    height: 28px;
    object-fit: contain;
    image-rendering: pixelated;
    flex: 0 0 auto;
    animation: gentleFloat 3s ease-in-out infinite;
    transform-origin: center;
  }

  /* A deliberately subtle motion so the pixel art still feels crisp. */
  @keyframes gentleFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5px); }
  }

  .weather-text {
    font-size: 16px;
    line-height: 1;
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    .icon { animation: none; }
  }
</style>
</head>
<body>
  <main class="weather" aria-label="New York City current weather">
    <img class="icon" id="icon" src="cloudy.png" alt="">
    <span class="weather-text" id="weatherText">NYC --°F</span>
  </main>

<script>
  const iconEl = document.getElementById("icon");
  const textEl = document.getElementById("weatherText");

  const icons = {
    sun: ["sunny.png", "Clear"],
    night: ["clear-night.png", "Clear"],
    partly: ["partly-cloudy.png", "Partly cloudy"],
    cloud: ["cloudy.png", "Cloudy"],
    fog: ["fog.png", "Fog"],
    rain: ["rain.png", "Rain"],
    sleet: ["sleet.png", "Sleet"],
    snow: ["snow.png", "Snow"],
    storm: ["thunderstorm.png", "Thunderstorm"]
  };

  function weatherType(code) {
    if (code === 0) return "sun";
    if ([1, 2].includes(code)) return "partly";
    if (code === 3) return "cloud";
    if ([45, 48].includes(code)) return "fog";
    if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return "rain";
    if ([56, 57, 66, 67].includes(code)) return "sleet";
    if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
    if ([95, 96, 99].includes(code)) return "storm";
    return "cloud";
  }

  function setIcon(type) {
    iconEl.src = icons[type][0];
    iconEl.alt = icons[type][1];
  }

  async function updateWeather() {
    try {
      const response = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=America%2FNew_York"
      );

      if (!response.ok) throw new Error();

      const data = await response.json();
      const temp = Math.round(data.current.temperature_2m);
      let type = weatherType(data.current.weather_code);

      // Switch clear-day to clear-night during nighttime in NYC.
      if (type === "sun") {
        const hour = Number(new Intl.DateTimeFormat("en-US", {
          hour: "numeric",
          hour12: false,
          timeZone: "America/New_York"
        }).format(new Date()));
        if (hour < 6 || hour >= 20) type = "night";
      }

      setIcon(type);
      textEl.textContent = `NYC ${temp}°F`;
    } catch {
      textEl.textContent = "NYC --°F";
      setIcon("cloud");
    }
  }

  updateWeather();
  setInterval(updateWeather, 15 * 60 * 1000);
</script>
</body>
</html>
