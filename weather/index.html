<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NYC Weather</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  .weather {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px;
    color: #1f1f1f;
    font-family: "DotGothic16", sans-serif;
    white-space: nowrap;
  }

  #icon {
    width: 30px;
    height: 30px;
    object-fit: contain;
    image-rendering: pixelated;
    flex: 0 0 auto;
  }

  .weather-text {
    font-size: 16px;
    line-height: 1;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <main class="weather" aria-label="New York City current weather">
    <img id="icon" src="cloudy.png" alt="">
    <span class="weather-text" id="weatherText">NYC --°F</span>
  </main>

<script>
  const iconEl = document.getElementById("icon");
  const textEl = document.getElementById("weatherText");

  function iconFor(code, isDay) {
    if (code === 0) return isDay ? "sunny.png" : "clear-night.png";
    if ([1, 2].includes(code)) return "partly-cloudy.png";
    if (code === 3 || [45, 48].includes(code)) return "cloudy.png";
    if ([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code)) {
      // Freezing drizzle/rain uses the sleet icon; ordinary rain uses rain.
      if ([56, 57, 66, 67].includes(code)) return "sleet.png";
      return "rain.png";
    }
    if ([71, 73, 75, 77, 85, 86].includes(code)) return "snow.png";
    if ([95, 96, 99].includes(code)) return "thunderstorm.png";
    return "cloudy.png";
  }

  async function updateWeather() {
    try {
      const response = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&current=temperature_2m,weather_code,is_day&temperature_unit=fahrenheit&timezone=America%2FNew_York"
      );

      if (!response.ok) throw new Error("Weather unavailable");

      const data = await response.json();
      const temp = Math.round(data.current.temperature_2m);
      const code = data.current.weather_code;
      const isDay = data.current.is_day === 1;

      iconEl.src = iconFor(code, isDay);
      textEl.textContent = `NYC ${temp}°F`;
    } catch (error) {
      textEl.textContent = "NYC --°F";
      iconEl.src = "cloudy.png";
    }
  }

  updateWeather();
  setInterval(updateWeather, 15 * 60 * 1000);
</script>
</body>
</html>
